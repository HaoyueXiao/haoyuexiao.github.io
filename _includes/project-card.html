<a class="card" href="{{ include.p.url }}">
	<div class="card-img"><img src="{{ include.p.image }}" alt="" loading="lazy" width="640" height="400" /></div>
	<div class="card-body">
		<span class="eyebrow">{{ include.p.course }}</span>
		<h3>{{ include.p.title }}</h3>
		<p>{{ include.p.description }}</p>
	</div>
</a>
