<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
{% assign page_title = page.title | default: site.title %}
<title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}" />
<meta property="og:title" content="{{ page_title }}" />
<meta property="og:description" content="{{ page.description | default: site.description | strip_html | truncate: 160 }}" />
<meta property="og:image" content="{{ page.cover | default: '/images/profile.jpg' | absolute_url }}" />
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}" />
{% if page.external_url %}<meta http-equiv="refresh" content="0; url={{ page.external_url }}" />
<link rel="canonical" href="{{ page.external_url | absolute_url }}" />
{% else %}<link rel="canonical" href="{{ page.url | absolute_url }}" />{% endif %}
<link rel="icon" href="/images/profile.jpg" />
<link rel="alternate" type="application/atom+xml" title="{{ site.title }} blog" href="/blog/feed.xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" />
<link rel="stylesheet" href="/assets/css/fontawesome-all.min.css" />
<link rel="stylesheet" href="/assets/css/site.css" />
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-MVHWKM91WS"></script>
<script>
	window.dataLayer = window.dataLayer || [];
	function gtag(){dataLayer.push(arguments);}
	gtag('js', new Date());
	gtag('config', 'G-MVHWKM91WS');
</script>
<script>
	try { var t = localStorage.getItem('theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
